[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-file-reader"
version = "1.2.4"
description = "MCP文件内容读取服务 - 从各类文件中提取内容"
authors = [{name = "Ben"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "fastmcp>=0.2",
    "pydantic>=2.0",
    "httpx>=0.27",
    "diskcache>=5.6",
    "python-dotenv>=1.0",
    "pymupdf4llm>=0.0.17",
    "langchain-openai>=0.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["src/*", "file_reader", "file_reader/*"] 